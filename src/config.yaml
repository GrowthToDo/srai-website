site:
  name: SimpleRosterAI
  site: 'https://simplerosterai.com'
  base: '/'
  trailingSlash: false
  googleSiteVerificationId: ''

metadata:
  title:
    default: SimpleRosterAI
    template: '%s — SimpleRosterAI'
  description: 'AI nurse duty rostering for Indian hospitals. The engine builds every ward roster against 48-hour, rest and weekly-off rules; your nursing office approves.'
  robots:
    index: true
    follow: true
  openGraph:
    site_name: SimpleRosterAI
    images:
      - url: '~/assets/images/social.png'
        width: 1200
        height: 628
    type: website
  twitter:
    cardType: summary_large_image

i18n:
  language: en-IN
  textDirection: ltr

apps:
  blog:
    isEnabled: false
    postsPerPage: 1
    post:
      isEnabled: false
      permalink: '/blog/%slug%'
      robots:
        index: false
    list:
      isEnabled: false
      pathname: 'blog'
      robots:
        index: false
    category:
      isEnabled: false
      pathname: 'category'
      robots:
        index: false
    tag:
      isEnabled: false
      pathname: 'tag'
      robots:
        index: false
    isRelatedPostsEnabled: false
    relatedPostsCount: 0

analytics:
  vendors:
    googleAnalytics:
      id: ''
      partytown: true

ui:
  theme: 'light:only'
